# Blueprint de Render para la API (https://render.com/docs/blueprint-spec). La web va en Vercel.
# Alternativas equivalentes: Railway o un Space de Hugging Face con el mismo comando de arranque.
services:
  - type: web
    name: alpha-centauri-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: CORS_ORIGENES
        value: https://alpha-centauri-five.vercel.app,http://localhost:5173,http://localhost:4173
      - key: MAX_EPISODIOS
        value: "50"
      - key: MLFLOW_UI_URL
        value: https://alpha-centauri-mlflow.onrender.com
  # Interfaz de MLflow de solo lectura sobre el mlflow.db versionado en el repo (experimentos, runs, etiquetas,
  # métricas y registro de modelos). Los artefactos grandes viven en mlruns/ con rutas locales: se consultan en el repo.
  # Se arranca la app de MLflow directamente con uvicorn: `mlflow server` levanta 10 procesos (ejecutor de trabajos
  # en segundo plano, ~1,6 GB) y no cabe en los 512 MB del plan gratuito; así es 1 proceso de ~250 MB.
  # Las variables _MLFLOW_SERVER_* son las que `mlflow server` le pasa a uvicorn (MLflow 3.17.2).
  - type: web
    name: alpha-centauri-mlflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-mlflow.txt
    startCommand: python -m uvicorn --host 0.0.0.0 --port $PORT --workers 1 mlflow.server.fastapi_app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
        value: "false"
      - key: _MLFLOW_SERVER_FILE_STORE
        value: sqlite:///mlflow.db
      - key: _MLFLOW_SERVER_REGISTRY_STORE
        value: sqlite:///mlflow.db
      - key: MLFLOW_REGISTRY_URI
        value: sqlite:///mlflow.db
      - key: _MLFLOW_SERVER_ARTIFACT_ROOT
        value: ./mlruns
      - key: _MLFLOW_SERVER_SERVE_ARTIFACTS
        value: "true"
      - key: _MLFLOW_SERVER_ARTIFACT_DESTINATION
        value: ./mlartifacts
      - key: _MLFLOW_SGI_NAME
        value: uvicorn
      # Sin esto MLflow 3 responde 403 a cualquier Host que no sea localhost (protección contra DNS rebinding)
      - key: MLFLOW_SERVER_ALLOWED_HOSTS
        value: alpha-centauri-mlflow.onrender.com,localhost,127.0.0.1
      - key: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
        value: https://alpha-centauri-mlflow.onrender.com,https://alpha-centauri-five.vercel.app
