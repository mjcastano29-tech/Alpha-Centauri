  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, .10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-1-soft: #86b6ef;
    --series-2-soft: #f4a98a;
    --series-3-soft: #7fd6b3;
    --series-4-soft: #f6cf6b;
    --other: #b5b3ab;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #898781;
    --success-text: #006300;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, .10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-1-soft: #1c5cab; --series-2-soft: #8a3a1a; --series-3-soft: #11684a; --series-4-soft: #7a5200; --other: #5a5953;
      --success-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, .10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 var(--font);

  .wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }

  h1 { margin: 0; font-size: clamp(24px, 3.5vw, 32px); line-height: 1.15; font-weight: 600; text-wrap: balance; }
  header p { margin: 0; color: var(--text-secondary); max-width: 72ch; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; }

  .hero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding: 18px 22px; }
  .hero .num { font-size: 56px; font-weight: 600; line-height: 1; }
  .hero .label { color: var(--text-secondary); font-size: 13px; }
  .hero .sub { color: var(--text-secondary); font-size: 13px; max-width: 60ch; }
  .hero .delta { font-weight: 600; }
  .delta.up { color: var(--success-text); }
  .delta.down { color: var(--critical); }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--text-secondary); }
  .filters label { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); cursor: pointer; }
  .filters input { accent-color: var(--text-primary); }
  .key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  .filters select { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }

  .kpi { padding: 6px 10px 10px; overflow-x: auto; }
  .kpi table { font-size: 13px; }
  .kpi th, .kpi td { padding: 8px 10px; vertical-align: top; }
  .kpi td.name { white-space: nowrap; }
  .kpi td.name i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 8px; vertical-align: 3px; }
  .kpi td .v { font-size: 17px; font-weight: 500; }
  .kpi td.best .v { font-weight: 700; }
  .kpi td .delta { display: block; font-size: 11px; }
  .kpi td .delta.flat { color: var(--text-muted); }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
  .chart { padding: 14px 16px 10px; display: grid; gap: 8px; min-width: 0; position: relative; align-content: start; }
  .chart.wide { grid-column: 1 / -1; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .chart-head p { margin: 0; font-size: 12px; color: var(--text-secondary); }
  .chart-head button { font: 12px var(--font); color: var(--text-secondary); background: none; border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .chart-head button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  .legend i.box { height: 10px; width: 10px; border-radius: 2px; }
  .plot { position: relative; }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 2; min-width: 120px; }
  .tip .t { color: var(--text-secondary); margin-bottom: 2px; }
  .tip .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tip .row b { font-weight: 600; }
  .tip .row span { color: var(--text-secondary); }
  .tip .row i { display: inline-block; width: 10px; height: 2px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; }
  .table-view { overflow-x: auto; max-height: 260px; overflow-y: auto; }
  .table-view[hidden] { display: none; }
  svg text { font-family: var(--font); fill: var(--text-muted); font-size: 11px; }
  svg .axis { stroke: var(--axis); stroke-width: 1; }
  svg .grid { stroke: var(--grid); stroke-width: 1; }
  svg .lbl { fill: var(--text-secondary); }
  svg .lbl.strong { fill: var(--text-primary); font-weight: 600; }
  svg .cross { stroke: var(--axis); stroke-width: 1; }
  svg .hit { fill: transparent; }
  footer { font-size: 12px; color: var(--text-muted); }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .charts { grid-template-columns: 1fr; } }

const $ = (s, el = document) => el.querySelector(s);
const SLOT = ["--series-1", "--series-2", "--series-3", "--series-4"];

const STATUS = { "aterrizaje": "--good", "fuera de plataforma": "--warning", "choque": "--critical", "sin pasos": "--neutral", "fuera de zona": "--serious", "colisión": "--critical" };
const STATUS_ICON = { "aterrizaje": "✓", "fuera de plataforma": "◐", "choque": "✕", "sin pasos": "…", "fuera de zona": "↗", "colisión": "⊗" };
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmtPct = (v) => `${Math.round(v * 100)} %`;
const fmtN = (v, d = 1) => v === null || v === undefined ? "—" : v.toLocaleString("es", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtInt = (v) => v === null || v === undefined ? "—" : v.toLocaleString("es");
const runs = DATA.runs.map((r, k) => ({ ...r, slot: k % 4, color: () => css(SLOT[k % 4]), soft: () => css(SLOT_SOFT[k % 4]), visible: true }));
const visibles = () => runs.filter((r) => r.visible);

// ---------- textos ----------
$("#intro").textContent = `${runs.length} ejecuciones evaluadas con las mismas 200 épocas nuevas (meteorología que no aparece al entrenar) y con la perturbación de viento lateral de ${DATA.viento} m/s. Las curvas de entrenamiento están resumidas en tramos; cada punto es la media de un tramo de épocas.`;
const best = [...runs].sort((a, b) => b.eval.normal.resumen.aterrizajes - a.eval.normal.resumen.aterrizajes)[0];
const first = runs[0];
$("#hero-num").textContent = fmtPct(best.eval.normal.resumen.aterrizajes);
$("#hero-label").textContent = `aterrizajes seguros · ${best.nombre}`;
{
  const d = best.eval.normal.resumen.aterrizajes - first.eval.normal.resumen.aterrizajes;
  const delta = best === first ? "" : ` <span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${Math.round(Math.abs(d) * 100)} puntos</span> frente a ${first.nombre}.`;
  $("#hero-sub").innerHTML = `El mejor modelo hasta ahora. Toca el suelo a ${fmtN(best.eval.normal.resumen.velocidad_contacto, 2)} m/s de media, a ${fmtN(best.eval.normal.resumen.error_posicion)} m del centro, y con viento de ${DATA.viento} m/s aterriza el ${fmtPct(best.eval.perturbado.resumen.aterrizajes)} de las veces.${delta}`;
}
$("#foot").textContent = `Generado el ${DATA.generado} desde resultados/runs/ (manifest, entrenamiento.json y evaluacion.json de cada ejecución). Detalle de parámetros y métricas en MLflow: mlflow ui --backend-store-uri sqlite:///mlflow.db`;

runs.forEach((r, k) => {

// ---------- tarjetas de cifras ----------
function tiles() {
  const el = $("#tiles"); el.textContent = "";
  const defs = [
    ["Aterrizajes seguros", (r) => fmtPct(r.eval.normal.resumen.aterrizajes), (r) => r.eval.normal.resumen.aterrizajes, true, (d) => `${d >= 0 ? "+" : "−"}${Math.round(Math.abs(d) * 100)} pts`],
    ["Velocidad de contacto", (r) => `${fmtN(r.eval.normal.resumen.velocidad_contacto, 2)} m/s`, (r) => r.eval.normal.resumen.velocidad_contacto, false, (d) => `${d >= 0 ? "+" : "−"}${fmtN(Math.abs(d), 2)} m/s`],
    ["Error de posición", (r) => `${fmtN(r.eval.normal.resumen.error_posicion)} m`, (r) => r.eval.normal.resumen.error_posicion, false, (d) => `${d >= 0 ? "+" : "−"}${fmtN(Math.abs(d))} m`],
    ["Primer aterrizaje", (r) => r.primer_aterrizaje ? `época ${fmtInt(r.primer_aterrizaje)}` : "nunca", (r) => r.primer_aterrizaje || Infinity, false, (d) => `${d >= 0 ? "+" : "−"}${fmtInt(Math.abs(d))} épocas`],
    ["Combustible por época", (r) => `${fmtN(r.eval.normal.resumen.combustible, 0)} kg`, (r) => r.eval.normal.resumen.combustible, false, (d) => `${d >= 0 ? "+" : "−"}${fmtN(Math.abs(d), 0)} kg`],
    [`Aterrizajes con viento ${DATA.viento} m/s`, (r) => fmtPct(r.eval.perturbado.resumen.aterrizajes), (r) => r.eval.perturbado.resumen.aterrizajes, true, (d) => `${d >= 0 ? "+" : "−"}${Math.round(Math.abs(d) * 100)} pts`],
  ];
  const base = runs[0], vis = visibles();
  const t = document.createElement("table"), thead = document.createElement("thead"), tbody = document.createElement("tbody");
  const hr = document.createElement("tr");
  ["ejecución", ...defs.map((d) => d[0])].forEach((h) => { const th = document.createElement("th"); th.textContent = h; hr.append(th); });
  thead.append(hr);
  const bestOf = defs.map(([, , val, upGood]) => {
    const vals = vis.map(val).filter(isFinite); if (!vals.length) return null;
    return upGood ? Math.max(...vals) : Math.min(...vals);
  });
  vis.forEach((r) => {
    const tr = document.createElement("tr");
    const name = document.createElement("td"); name.className = "name";
    const key = document.createElement("i"); key.style.background = r.color();
    name.append(key, document.createTextNode(r.nombre)); tr.append(name);
    defs.forEach(([, show, val, upGood, fmtD], j) => {
      const td = document.createElement("td");
      const v = val(r), d = r === base || !isFinite(v) || !isFinite(val(base)) ? null : v - val(base);
      if (bestOf[j] !== null && isFinite(v) && v === bestOf[j]) td.className = "best";
      const value = document.createElement("span"); value.className = "v"; value.textContent = show(r);
      const delta = document.createElement("span");
      if (d === null) { delta.className = "delta flat"; delta.textContent = r === base ? "referencia" : "—"; }
      else { const good = upGood ? d >= 0 : d <= 0; delta.className = "delta " + (d === 0 ? "flat" : good ? "up" : "down"); delta.textContent = `${fmtD(d)} vs exp. 1`; }
      td.append(value, delta); tr.append(td);
    });
    tbody.append(tr);
  });
  t.append(thead, tbody); el.append(t);
}

// ---------- utilidades SVG ----------
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function niceTicks(lo, hi, n = 4) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
const compact = (v) => Math.abs(v) >= 1000 ? `${(v / 1000).toLocaleString("es", { maximumFractionDigits: 1 })}K` : v.toLocaleString("es", { maximumFractionDigits: 2 });

function card(id, title, caption, wide = false) {
  const c = document.createElement("div"); c.className = "card chart" + (wide ? " wide" : ""); c.id = id;
  c.innerHTML = `<div class="chart-head"><div><h2></h2><p></p></div><button type="button" aria-expanded="false">Ver tabla</button></div><div class="legend"></div><div class="plot"><div class="tip"></div></div><div class="table-view" hidden></div>`;
  $("h2", c).textContent = title; $("p", c).textContent = caption;
  const btn = $("button", c), tv = $(".table-view", c);
  btn.addEventListener("click", () => { const open = tv.hidden; tv.hidden = !open; btn.textContent = open ? "Ocultar tabla" : "Ver tabla"; btn.setAttribute("aria-expanded", String(open)); });
  $("#charts").append(c);
  return c;
}
function legend(c, items) {
  const l = $(".legend", c); l.textContent = "";
  items.forEach(({ name, color, box }) => { const s = document.createElement("span"); const i = document.createElement("i"); if (box) i.className = "box"; i.style.background = color; s.append(i, document.createTextNode(name)); l.append(s); });
}
function table(c, header, rows) {
  const tv = $(".table-view", c); tv.textContent = "";
  const t = document.createElement("table"), thead = document.createElement("thead"), tbody = document.createElement("tbody");
  const tr = document.createElement("tr"); header.forEach((h) => { const th = document.createElement("th"); th.textContent = h; tr.append(th); }); thead.append(tr);
  rows.forEach((row) => { const tr = document.createElement("tr"); row.forEach((v) => { const td = document.createElement("td"); td.textContent = v; tr.append(td); }); tbody.append(tr); });
  t.append(thead, tbody); tv.append(t);
}
function tip(c, x, y, title, rows) {
  const t = $(".tip", c); t.textContent = "";
  const h = document.createElement("div"); h.className = "t"; h.textContent = title; t.append(h);
  rows.forEach(([color, value, label]) => { const r = document.createElement("div"); r.className = "row"; const i = document.createElement("i"); i.style.background = color; const b = document.createElement("b"); b.textContent = value; const s = document.createElement("span"); s.textContent = label; r.append(i, b, s); t.append(r); });
  t.style.display = "block";
  const plot = $(".plot", c), W = plot.clientWidth;
  t.style.left = `${Math.min(x + 12, W - t.offsetWidth - 4)}px`; t.style.top = `${Math.max(0, y - 10)}px`;
}
const hideTip = (c) => { $(".tip", c).style.display = "none"; };
function frame(c, height, m) {
  const plot = $(".plot", c); plot.querySelector("svg")?.remove();
  const W = Math.max(280, plot.clientWidth);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${height}`, width: W, height, role: "img" });
  plot.append(svg);
  return { svg, W, H: height, L: m.l, R: W - m.r, T: m.t, B: height - m.b };
}

  const f = frame(c, 260, { l: 44, r: 16, t: 14, b: 32 });
  const vis = series.filter((s) => s.run.visible);
  const xs = vis.flatMap((s) => s.x), ys = vis.flatMap((s) => s.y);
  if (!xs.length) return;
  const xmax = Math.max(...xs), xmin = 0;
  let [ylo, yhi] = yDomain || [Math.min(0, ...ys), Math.max(...ys)];
  if (!yDomain) { const pad = (yhi - ylo || 1) * 0.08; ylo -= pad; yhi += pad; }
  const X = (v) => f.L + (v - xmin) / (xmax - xmin || 1) * (f.R - f.L), Y = (v) => f.B - (v - ylo) / (yhi - ylo) * (f.B - f.T);
  niceTicks(ylo, yhi, 4).forEach((v) => { f.svg.append(svgEl("line", { x1: f.L, x2: f.R, y1: Y(v), y2: Y(v), class: "grid" })); f.svg.append(svgEl("text", { x: f.L - 6, y: Y(v) + 4, "text-anchor": "end" }, pct ? `${Math.round(v * 100)} %` : compact(v))); });
  f.svg.append(svgEl("line", { x1: f.L, x2: f.R, y1: f.B, y2: f.B, class: "axis" }));
  niceTicks(xmin, xmax, 5).forEach((v) => f.svg.append(svgEl("text", { x: X(v), y: f.B + 16, "text-anchor": "middle" }, compact(v))));
  f.svg.append(svgEl("text", { x: f.R, y: f.B + 28, "text-anchor": "end" }, xLabel));
  if (yLabel) f.svg.append(svgEl("text", { x: f.L - 6, y: f.T - 2, "text-anchor": "end" }, yLabel));
  const placed = [];
  vis.forEach((s) => {
    const d = s.x.map((x, i) => `${i ? "L" : "M"}${X(x).toFixed(1)} ${Y(s.y[i]).toFixed(1)}`).join(" ");
    f.svg.append(svgEl("path", { d, fill: "none", stroke: s.run.color(), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (markers) s.x.forEach((x, i) => { f.svg.append(svgEl("circle", { cx: X(x), cy: Y(s.y[i]), r: 4, fill: s.run.color(), stroke: css("--surface-1"), "stroke-width": 2 })); });
    const n = s.x.length - 1, ey = Y(s.y[n]);
    if (!placed.some((p) => Math.abs(p - ey) < 12)) { placed.push(ey); f.svg.append(svgEl("text", { x: X(s.x[n]) + 6, y: ey + 4, class: "lbl strong" }, yFmt(s.y[n]))); }
  });
  // cruz: busca el tramo más cercano en x y lista todas las series
  const cross = svgEl("line", { y1: f.T, y2: f.B, class: "cross", visibility: "hidden" }); f.svg.append(cross);
  const hit = svgEl("rect", { x: f.L, y: f.T, width: f.R - f.L, height: f.B - f.T, class: "hit" }); f.svg.append(hit);
  const onMove = (ev) => {
    const r = f.svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (f.W / r.width);
    const xv = xmin + (px - f.L) / (f.R - f.L) * (xmax - xmin);
    const rows = vis.map((s) => { let k = 0; for (let i = 0; i < s.x.length; i++) if (Math.abs(s.x[i] - xv) < Math.abs(s.x[k] - xv)) k = i; return [s.run.color(), yFmt(s.y[k]), `${s.run.nombre} · época ${fmtInt(s.x[k])}`]; });
    const snap = vis[0].x.reduce((a, b) => Math.abs(b - xv) < Math.abs(a - xv) ? b : a);
    cross.setAttribute("x1", X(snap)); cross.setAttribute("x2", X(snap)); cross.setAttribute("visibility", "visible");
    tip(c, X(snap) * (r.width / f.W), (ev.clientY - r.top), `época ≈ ${fmtInt(Math.round(snap))}`, rows);
  };
  hit.addEventListener("pointermove", onMove); hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(c); });
  hit.setAttribute("tabindex", "0"); hit.addEventListener("focus", (ev) => onMove({ clientX: f.svg.getBoundingClientRect().left + f.R * 0.98, clientY: f.svg.getBoundingClientRect().top + f.T + 10 }));
  hit.addEventListener("blur", () => { cross.setAttribute("visibility", "hidden"); hideTip(c); });
  legend(c, vis.map((s) => ({ name: s.run.nombre, color: s.run.color() })));
}

// ---------- barras apiladas horizontales (resultados) ----------
function stacked(c, rows) {
  const vis = rows.filter((r) => r.run.visible);
  const rowH = 30, f = frame(c, 24 + vis.length * (rowH + 10) + 26, { l: 150, r: 16, t: 12, b: 26 });
  const X = (v) => f.L + v * (f.R - f.L);
  [0, 0.25, 0.5, 0.75, 1].forEach((v) => { f.svg.append(svgEl("line", { x1: X(v), x2: X(v), y1: f.T, y2: f.B, class: "grid" })); f.svg.append(svgEl("text", { x: X(v), y: f.B + 16, "text-anchor": "middle" }, `${v * 100} %`)); });
  const tableRows = [];
  vis.forEach((row, i) => {
    const y = f.T + i * (rowH + 10), total = Object.values(row.counts).reduce((a, b) => a + b, 0);
    f.svg.append(svgEl("text", { x: f.L - 10, y: y + 15, "text-anchor": "end", class: "lbl" }, row.label));
    f.svg.append(svgEl("text", { x: f.L - 10, y: y + 27, "text-anchor": "end" }, row.sub));
    let acc = 0;
    DATA.outcomes.forEach((name) => {
      const n = row.counts[name]; if (!n) return;
      const x0 = X(acc / total), x1 = X((acc + n) / total), w = Math.max(0, x1 - x0 - 2);
      const rect = svgEl("rect", { x: x0, y: y + 3, width: w, height: 24, fill: css(STATUS[name]), rx: 0 });
      f.svg.append(rect);
      const label = `${STATUS_ICON[name]} ${Math.round(n / total * 100)} %`;
      if (w > label.length * 7 + 12) f.svg.append(svgEl("text", { x: x0 + w / 2, y: y + 19, "text-anchor": "middle", fill: name === "fuera de plataforma" ? "#0b0b0b" : "#ffffff", style: "fill:" + (name === "fuera de plataforma" ? "#0b0b0b" : "#ffffff") }, label));
      const show = (ev) => { const r = f.svg.getBoundingClientRect(); tip(c, (ev.clientX - r.left), (ev.clientY - r.top), row.label + " · " + row.sub, [[css(STATUS[name]), `${n} de ${total} (${Math.round(n / total * 100)} %)`, name]]); rect.setAttribute("opacity", "0.8"); };
      rect.addEventListener("pointermove", show); rect.addEventListener("pointerleave", () => { hideTip(c); rect.removeAttribute("opacity"); });
      rect.setAttribute("tabindex", "0"); rect.addEventListener("focus", (ev) => show({ clientX: f.svg.getBoundingClientRect().left + (x0 + w / 2), clientY: f.svg.getBoundingClientRect().top + y })); rect.addEventListener("blur", () => hideTip(c));
      acc += n;
    });
    tableRows.push([row.label + " · " + row.sub, ...DATA.outcomes.map((name) => `${row.counts[name]} (${Math.round(row.counts[name] / total * 100)} %)`)]);
  });
  legend(c, DATA.outcomes.map((name) => ({ name: `${STATUS_ICON[name]} ${name} (${DATA.rewards[name] > 0 ? "+" : ""}${DATA.rewards[name]})`, color: css(STATUS[name]), box: true })));
  table(c, ["ejecución · condición", ...DATA.outcomes], tableRows);
}

// ---------- dispersión: punto de contacto sobre la plataforma ----------
function scatter(c) {
  const vis = visibles(); if (!vis.length) return;
  const cols = vis.length === 1 ? 1 : 2, rowsN = Math.ceil(vis.length / cols), cellH = 230;
  const f = frame(c, 8 + rowsN * cellH + 26, { l: 8, r: 8, t: 8, b: 26 });
  const cellW = (f.R - f.L) / cols, R = 60, s = Math.min(cellW, cellH - 40) / 2 / R;
  const pts = [], tableRows = [];
  vis.forEach((run, i) => {
    const cx = f.L + (i % cols) * cellW + cellW / 2, cy = f.T + Math.floor(i / cols) * cellH + 20 + (cellH - 40) / 2;
    const X = (x) => cx + x * s, Y = (y) => cy - y * s;
    f.svg.append(svgEl("text", { x: cx, y: f.T + Math.floor(i / cols) * cellH + 12, "text-anchor": "middle", class: "lbl strong" }, run.nombre));
    [10, 20, 30, 40, 50].forEach((r) => f.svg.append(svgEl("circle", { cx, cy, r: r * s, fill: "none", class: r === DATA.pad_radius ? "axis" : "grid" })));
    f.svg.append(svgEl("circle", { cx, cy, r: DATA.pad_radius * s, fill: css("--good"), "fill-opacity": 0.12 }));
    if (i === 0) [20, 40].forEach((r) => f.svg.append(svgEl("text", { x: cx + r * s * 0.707 + 3, y: cy - r * s * 0.707 - 3 }, `${r} m`)));
    let fuera = 0;
    run.eval.normal.filas.forEach((row, k) => {
      if (!row.toca_suelo) return;
      if (Math.hypot(row.x, row.y) > R) { fuera++; return; }
      const dot = svgEl("circle", { cx: X(row.x), cy: Y(row.y), r: 3.5, fill: run.color(), stroke: css("--surface-1"), "stroke-width": 1.5, "fill-opacity": row.resultado === "aterrizaje" ? 1 : 0.5 });
      f.svg.append(dot); pts.push({ dot, run, row, k });
      tableRows.push([run.nombre, k + 1, row.resultado, row.x, row.y, row.dist, row.vz, row.vh]);
    });
    if (fuera) f.svg.append(svgEl("text", { x: cx, y: cy + R * s + 14, "text-anchor": "middle" }, `${fuera} más allá de 60 m`));
  });
  f.svg.append(svgEl("text", { x: f.R, y: f.B + 20, "text-anchor": "end" }, "verde = plataforma (r = 10 m) · tenue = no aterrizó"));
  // capa de punto más cercano: no hace falta acertar al punto
  const hit = svgEl("rect", { x: f.L, y: f.T, width: f.R - f.L, height: f.B - f.T, class: "hit" }); f.svg.append(hit);
  let last = null;
  hit.addEventListener("pointermove", (ev) => {
    const r = f.svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (f.W / r.width), py = (ev.clientY - r.top) * (f.H / r.height);
    let bestP = null, bd = 1e9;
    pts.forEach((p) => { const d = Math.hypot(+p.dot.getAttribute("cx") - px, +p.dot.getAttribute("cy") - py); if (d < bd) { bd = d; bestP = p; } });
    if (last) last.dot.setAttribute("r", 3.5);
    if (!bestP || bd > 40) { hideTip(c); last = null; return; }
    bestP.dot.setAttribute("r", 6); last = bestP;
    tip(c, +bestP.dot.getAttribute("cx") * (r.width / f.W), +bestP.dot.getAttribute("cy") * (r.height / f.H), `${bestP.run.nombre} · época de evaluación ${bestP.k + 1}`,
      [[bestP.run.color(), `${fmtN(bestP.row.dist)} m del centro`, bestP.row.resultado], [bestP.run.color(), `${fmtN(Math.abs(bestP.row.vz), 2)} m/s`, "vertical al contacto"], [bestP.run.color(), `${fmtN(bestP.row.vh, 2)} m/s`, "horizontal al contacto"]]);
  });
  hit.addEventListener("pointerleave", () => { hideTip(c); if (last) last.dot.setAttribute("r", 3.5); last = null; });
  legend(c, vis.map((run) => ({ name: run.nombre, color: run.color() })));
  table(c, ["ejecución", "época", "resultado", "x (m)", "y (m)", "distancia (m)", "vz (m/s)", "vh (m/s)"], tableRows);
}

// ---------- histogramas en pequeños múltiplos: velocidad de contacto ----------
function histograms(c) {
  const vis = visibles(); if (!vis.length) return;
  const rowH = 90, f = frame(c, 12 + vis.length * rowH + 30, { l: 132, r: 16, t: 12, b: 30 });
  const edges = []; for (let v = 0; v <= 12; v += 0.5) edges.push(v);
  const X = (v) => f.L + Math.min(v, 12) / 12 * (f.R - f.L);
  const tableRows = [];
  vis.forEach((run, i) => {
    const y0 = f.T + i * rowH, y1 = y0 + rowH - 22;
    const vals = run.eval.normal.filas.filter((r) => r.toca_suelo).map((r) => Math.min(Math.abs(r.vz), 11.99));
    const counts = edges.slice(0, -1).map((e, k) => vals.filter((v) => v >= e && v < edges[k + 1]).length);
    const max = Math.max(1, ...counts), Y = (n) => y1 - n / max * (y1 - y0 - 14);
    const name = run.nombre.split(" · ");
    f.svg.append(svgEl("text", { x: f.L - 10, y: (y0 + y1) / 2 - 2, "text-anchor": "end", class: "lbl strong" }, name[0]));
    f.svg.append(svgEl("text", { x: f.L - 10, y: (y0 + y1) / 2 + 12, "text-anchor": "end", class: "lbl" }, name.slice(1).join(" · ")));
    f.svg.append(svgEl("line", { x1: f.L, x2: f.R, y1, y2: y1, class: "axis" }));
    const lim = X(DATA.max_vz); f.svg.append(svgEl("line", { x1: lim, x2: lim, y1: y0 + 2, y2: y1, class: "axis" }));
    if (i === 0) f.svg.append(svgEl("text", { x: lim + 4, y: y0 + 10 }, `límite seguro ${DATA.max_vz} m/s`));
    counts.forEach((n, k) => {
      if (!n) return;
      const x0 = X(edges[k]) + 1, w = Math.max(1, X(edges[k + 1]) - X(edges[k]) - 2), ry = Y(n);
      const d = `M${x0} ${y1} V${ry + 4} a4 4 0 0 1 4 -4 h${Math.max(0, w - 8)} a4 4 0 0 1 4 4 V${y1} Z`;
      const bar = svgEl("path", { d, fill: run.color() }); f.svg.append(bar);
      const show = (ev) => { const r = f.svg.getBoundingClientRect(); tip(c, ev.clientX - r.left, ev.clientY - r.top, `${run.nombre} · ${edges[k]}–${edges[k + 1]} m/s`, [[run.color(), `${n} épocas`, `${Math.round(n / vals.length * 100)} % de las que tocan suelo`]]); bar.setAttribute("opacity", "0.8"); };
      bar.addEventListener("pointermove", show); bar.addEventListener("pointerleave", () => { hideTip(c); bar.removeAttribute("opacity"); });
      tableRows.push([run.nombre, `${edges[k]}–${edges[k + 1]}`, n]);
    });
    const med = vals.length ? [...vals].sort((a, b) => a - b)[Math.floor(vals.length / 2)] : null;
    if (med !== null) {
      f.svg.append(svgEl("text", { x: f.L - 10, y: (y0 + y1) / 2 + 26, "text-anchor": "end" }, `mediana ${fmtN(med, 2)} m/s`));
      f.svg.append(svgEl("text", { x: f.L - 10, y: (y0 + y1) / 2 + 39, "text-anchor": "end" }, `${vals.length} tocan suelo`));
    }
  });
  niceTicks(0, 12, 6).forEach((v) => f.svg.append(svgEl("text", { x: X(v), y: f.B + 16, "text-anchor": "middle" }, v)));
  f.svg.append(svgEl("text", { x: f.R, y: f.B + 28, "text-anchor": "end" }, "velocidad vertical al tocar el suelo (m/s); las de más de 12 m/s se acumulan en el último intervalo"));
  legend(c, vis.map((run) => ({ name: run.nombre, color: run.color(), box: true })));
  table(c, ["ejecución", "intervalo (m/s)", "épocas"], tableRows);
}

// ---------- mancuernas: normal -> con viento ----------
function dumbbell(c) {
  const vis = visibles(); if (!vis.length) return;
  const metrics = [
    ["Aterrizajes seguros", (s) => s.aterrizajes, (v) => fmtPct(v), [0, 1]],
    ["Error de posición (m)", (s) => s.error_posicion, (v) => `${fmtN(v)} m`, null],
    ["Velocidad de contacto (m/s)", (s) => s.velocidad_contacto || 0, (v) => `${fmtN(v, 2)} m/s`, null],
  ];
  const rowH = 26, groupGap = 16, titleH = 24;
  const f = frame(c, 10 + metrics.length * (titleH + vis.length * rowH + groupGap) + 10, { l: 150, r: 110, t: 8, b: 8 });
  const tableRows = [];
  let y = f.T;
  metrics.forEach(([name, get, fmt, dom]) => {
    const vals = vis.flatMap((r) => [get(r.eval.normal.resumen), get(r.eval.perturbado.resumen)]);
    const [lo, hi] = dom || [0, Math.max(...vals) * 1.15 || 1];
    const X = (v) => f.L + (v - lo) / (hi - lo) * (f.R - f.L);
    f.svg.append(svgEl("text", { x: 4, y: y + 12, class: "lbl strong" }, name));
    vis.forEach((run, i) => {
      const yy = y + titleH + 8 + i * rowH, a = get(run.eval.normal.resumen), b = get(run.eval.perturbado.resumen);
      f.svg.append(svgEl("line", { x1: f.L, x2: f.R, y1: yy, y2: yy, class: "grid" }));
      f.svg.append(svgEl("line", { x1: X(a), x2: X(b), y1: yy, y2: yy, stroke: run.soft(), "stroke-width": 2 }));
      f.svg.append(svgEl("circle", { cx: X(a), cy: yy, r: 5, fill: run.color(), stroke: css("--surface-1"), "stroke-width": 2 }));
      f.svg.append(svgEl("circle", { cx: X(b), cy: yy, r: 5, fill: run.soft(), stroke: css("--surface-1"), "stroke-width": 2 }));
      f.svg.append(svgEl("text", { x: f.L - 10, y: yy + 4, "text-anchor": "end" }, run.nombre));
      f.svg.append(svgEl("text", { x: f.R + 6, y: yy + 4, class: "lbl" }, `${fmt(a)} → ${fmt(b)}`));
      const hit = svgEl("rect", { x: f.L, y: yy - 12, width: f.R - f.L, height: 24, class: "hit" }); f.svg.append(hit);
      hit.addEventListener("pointermove", (ev) => { const r = f.svg.getBoundingClientRect(); tip(c, ev.clientX - r.left, ev.clientY - r.top, `${run.nombre} · ${name}`, [[run.color(), fmt(a), "viento normal (0–10 m/s)"], [run.soft(), fmt(b), `viento de ${DATA.viento} m/s`]]); });
      hit.addEventListener("pointerleave", () => hideTip(c));
      tableRows.push([name, run.nombre, fmt(a), fmt(b)]);
    });
    y += titleH + vis.length * rowH + groupGap;
  });
  legend(c, [{ name: "condiciones normales (0–10 m/s)", color: css("--text-primary") }, { name: `perturbación: viento de ${DATA.viento} m/s (tono claro)`, color: css("--other") }]);
  table(c, ["métrica", "ejecución", "normal", `viento ${DATA.viento} m/s`], tableRows);
}

// ---------- montaje ----------
const C = {
  rate: card("c-rate", "Aterrizajes durante el entrenamiento", "Fracción de épocas que aterrizan en cada tramo de entrenamiento (con exploración). Una época es un intento completo.", true),
  reward: card("c-reward", "Recompensa media por época", "Media por tramo: +100 por aterrizar, −50 fuera de la plataforma, −100 choque / sin pasos / fuera de zona, más la aproximación y el combustible."),
  checks: card("c-checks", "Evaluación periódica sin explorar", "Cada cierto número de épocas el modelo de ese momento juega 50 épocas sin explorar; el modelo final es la mejor de estas versiones."),
  outcomes: card("c-outcomes", "Cómo terminan las 200 épocas de evaluación", "Mismas 200 épocas para todas las ejecuciones, en condiciones normales y con viento lateral fuerte.", true),
  scatter: card("c-scatter", "Dónde toca el suelo", "Punto de contacto (x, y) de las 200 épocas de evaluación en condiciones normales, visto desde arriba; más allá de 60 m no se dibuja."),
  hist: card("c-hist", "Velocidad de contacto", "Distribución de la velocidad vertical al tocar el suelo (≤ 3 m/s es aterrizaje suave)."),
  dumb: card("c-dumb", "Qué pierde cada modelo con viento", `Cada métrica en condiciones normales y con viento de ${DATA.viento} m/s.`, true),
};
function drawAll() {
  tiles();
  lineChart(C.rate, { series: runs.map((r) => ({ run: r, x: r.curva.x, y: r.curva.aterrizajes })), yFmt: fmtPct, yDomain: [0, 1], xLabel: "época de entrenamiento", pct: true });
  lineChart(C.reward, { series: runs.map((r) => ({ run: r, x: r.curva.x, y: r.curva.recompensa })), yFmt: (v) => fmtN(v, 0), xLabel: "época de entrenamiento", yLabel: "puntos" });
  lineChart(C.checks, { series: runs.map((r) => ({ run: r, x: r.checks.epoch, y: r.checks.landings.map((n) => n / DATA.check_episodes) })), yFmt: fmtPct, yDomain: [0, 1], xLabel: "época en la que se evaluó", pct: true, markers: true });
  table(C.rate, ["ejecución", "época (fin del tramo)", "aterrizajes", "recompensa media", "combustible (kg)"], runs.flatMap((r) => r.curva.x.map((x, i) => [r.nombre, x, fmtPct(r.curva.aterrizajes[i]), r.curva.recompensa[i], r.curva.combustible[i]])));
  table(C.reward, ["ejecución", "época (fin del tramo)", "recompensa media"], runs.flatMap((r) => r.curva.x.map((x, i) => [r.nombre, x, r.curva.recompensa[i]])));
  table(C.checks, ["ejecución", "época", `aterrizajes de ${DATA.check_episodes}`], runs.flatMap((r) => r.checks.epoch.map((x, i) => [r.nombre, x, r.checks.landings[i]])));
  stacked(C.outcomes, runs.flatMap((r) => [{ run: r, label: r.nombre, sub: "normal", counts: r.eval.normal.resumen.resultados }, { run: r, label: r.nombre, sub: `viento ${DATA.viento} m/s`, counts: r.eval.perturbado.resumen.resultados }]));
  scatter(C.scatter); histograms(C.hist); dumbbell(C.dumb);
}
drawAll();
let rt = null;
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(drawAll, 120); }).observe($("#charts"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);
new MutationObserver(drawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
